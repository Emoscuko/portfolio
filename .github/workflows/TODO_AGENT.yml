name: TODO Agent (Antigravity)
on:
  issues:
    types: [labeled]

jobs:
  run-agent:
    # Triggers only when you label an issue with "todo-agent-run"
    if: github.event.label.name == 'todo-agent-run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (LTS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI Dependencies
        run: pip install google-generativeai

      - name: Execute Antigravity Brain
        env:
          GEMINI_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/todo_brain.py