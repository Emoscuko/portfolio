<div class="split-container" #splitContainer>
    <!-- Developer Side -->
    <div class="panel dev-panel" routerLink="/dev">
        <app-particle-field [theme]="'flux'"></app-particle-field>
        <div class="content" [ngStyle]="{
            'transform': 'perspective(1000px) rotateX(' + devTilt.x + 'deg) rotateY(' + devTilt.y + 'deg)'
        }">
            <div class="subtitle">PORTFOLIO</div>
            <h1>Developer Side</h1>
            <div class="cta">Explore Dev Work</div>
        </div>
    </div>

    <!-- Fitness Side -->
    <div class="panel fitness-panel" routerLink="/fitness">
        <app-particle-field [theme]="'embers'"></app-particle-field>
        <div class="content" [ngStyle]="{
            'transform': 'perspective(1000px) rotateX(' + fitTilt.x + 'deg) rotateY(' + fitTilt.y + 'deg)'
        }">
            <div class="subtitle">LIFESTYLE</div>
            <h1>Bodybuilding Side</h1>
            <div class="cta">View Progress</div>
        </div>
    </div>

    <div class="main-social-footer">
        <a href="https://www.instagram.com/emirhanatar/" target="_blank" class="main-ig-link">
            <img src="https://cdn.simpleicons.org/instagram/E4405F" width="22" height="22" alt="Instagram"
                class="ig-icon">
            @emirhanatar
        </a>
    </div>
</div>
